[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootloader-app"
version = "0.1.0"
description = "Motorola Bootloader Utility Pro"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Copilot" }]

[project.scripts]
bootloader-app = "bootloader_app:main"

[tool.setuptools]
py-modules = ["bootloader_app"]
